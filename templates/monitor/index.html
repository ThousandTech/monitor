{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="A terminal for live system statistics.">
  <title>~/</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230d1117'/%3E%3Cpath d='m8 9 7 7-7 7m10 0h7' fill='none' stroke='%2339ff88' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'monitor/terminal.min.css' %}">
  <link rel="stylesheet" href="{% static 'monitor/monitor.css' %}">
  <script src="{% static 'monitor/terminal.js' %}" defer></script>
</head>
<body class="terminal">
  <main id="terminal" class="monitor-terminal" data-stats-url="{% url 'monitor:stats' %}" aria-label="System monitor terminal">
    <div id="terminal-output" aria-label="Terminal output"></div>
    <form id="command-form" class="command-line" autocomplete="off" aria-label="Terminal command">
      <label id="command-prompt" class="command-prompt" for="command-input">Thousand@the-oldest-house:~$</label>
      <input id="command-input" name="command" type="text" aria-label="Command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
    </form>
    <noscript>JavaScript is required to use this terminal.</noscript>
  </main>
</body>
</html>
